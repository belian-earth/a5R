url: https://belian-earth.github.io/a5R/
development:
  mode: auto
template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: '#74ac90ff'
  math-rendering: mathjax
navbar:
  structure:
    left:
    - reference
    - intro
    - articles
    - news
    right:
    - search
    - github
  components:
    github:
      icon: fa-github
      href: https://github.com/belian-earth/a5R
reference:
- title: Indexing
  desc: Convert between coordinates and A5 cell indices.
  contents:
  - a5_lonlat_to_cell
  - a5_cell_to_lonlat
- title: Cell type
  desc: The `a5_cell` vector type and helpers.
  contents:
  - a5_cell
  - a5_u64_to_hex
- title: Arrow & Parquet
  desc: Lossless conversion between `a5_cell` and Arrow `uint64` arrays.
  contents:
  - a5_cell_from_arrow
- title: Hierarchy
  desc: Navigate the cell hierarchy across resolutions.
  contents:
  - a5_get_resolution
  - a5_cell_to_parent
  - a5_cell_to_children
  - a5_get_res0_cells
- title: Geometry & info
  desc: Cell boundaries, areas, counts, and distances.
  contents:
  - a5_cell_to_boundary
  - a5_cell_distance
  - a5_cell_area
  - a5_get_num_cells
  - a5_get_num_children
- title: Traversal
  desc: Neighbourhood and distance-based cell selection.
  contents:
  - a5_grid_disk
  - a5_spherical_cap
- title: Compact & uncompact
  desc: Compress and expand sets of cells.
  contents:
  - a5_compact
  - a5_uncompact
- title: Geometry indexing
  desc: Convert polygons and linestrings to cells covering them.
  contents:
  - a5_polygon_to_cells
  - a5_linestring_to_cells
- title: Configuration
  desc: Thread control for parallel processing.
  contents:
  - a5_set_threads
- title: wk integration
  desc: Methods for the wk geometry framework.
  contents: wk_methods
- title: Deprecated
  desc: Functions superseded by other parts of the API.
  contents:
  - a5_grid
