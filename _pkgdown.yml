url: https://belian-earth.github.io/a5R/
development:
  mode: auto
template:
  bootstrap: 5
  bootswatch: cosmo
  bslib:
    primary: '#74ac90ff'
  math-rendering: mathjax
navbar:
  structure:
    left:
    - reference
    - intro
    - articles
    - news
    right:
    - search
    - github
  components:
    github:
      icon: fa-github
      href: https://github.com/belian-earth/a5R
reference:
- title: Indexing
  desc: Convert between coordinates and A5 cell indices.
  contents:
  - a5_coordinates
- title: Cell type
  desc: The `a5_cell` vector type and helpers.
  contents:
  - a5_cell
  - a5_cell_list
  - a5_is_valid
  - a5_u64_to_hex
  - a5_migrate
  - a5_index_version
- title: Arrow & Parquet
  desc: Lossless conversion to and from Arrow arrays.
  contents:
  - a5_cell_from_arrow
  - a5_covering_from_arrow
  - a5_to_arrow_table
- title: Hierarchy
  desc: Navigate the cell hierarchy across resolutions.
  contents:
  - a5_get_resolution
  - a5_hierarchy
  - a5_spatial_hierarchy
  - a5_cell_to_resolution
  - a5_cell_child
  - a5_cell_children_range
  - a5_get_res0_cells
- title: Geometry & info
  desc: Cell boundaries, areas, counts, and distances.
  contents:
  - a5_cell_to_boundary
  - a5_cell_to_boundary_xy
  - a5_cell_distance
  - a5_resolution_stats
- title: Traversal
  desc: Neighbourhood and distance-based cell selection.
  contents:
  - a5_grid_disk
  - a5_spherical_cap
- title: Coverings
  desc: Compacted sets of cells that record their resolution.
  contents:
  - a5_covering
  - a5_covering_stored
  - a5_compaction
  - a5_set_operations
  - a5_covering_predicates
  - a5_covering_measures
- title: Geometry indexing
  desc: Convert polygons and linestrings to cells covering them.
  contents:
  - a5_polygon_to_cells
  - a5_linestring_to_cells
  - a5_bbox
- title: Configuration
  desc: Thread control for parallel processing, and error classes.
  contents:
  - a5_set_threads
  - with_a5_threads
  - a5_errors
  - a5_c_api
- title: wk integration
  desc: Methods for the wk geometry framework.
  contents: wk_methods
