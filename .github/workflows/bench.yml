name: bench

# Compare benchmark performance of the PR against its merge-base with main.
# Both runs execute on the same runner minutes apart, so machine variance
# largely cancels out. The PR's benchmark files drive both runs; only the
# library code (R/, src/, NAMESPACE) is switched to the baseline commit.
on:
  pull_request:

permissions:
  contents: read

# A new push to the PR supersedes any run still in progress.
concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      BENCH_TIME: "2"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/rust

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: any::bench, any::jsonlite

      - name: Install package (PR)
        run: R CMD INSTALL --no-docs --no-multiarch .

      - name: Run benchmarks (PR)
        run: Rscript benchmarks/run.R bench-current.json

      - name: Switch library code to baseline
        run: |
          BASE=$(git merge-base origin/main HEAD)
          echo "Baseline commit: $BASE"
          git checkout "$BASE" -- R src NAMESPACE

      - name: Install package (baseline)
        run: R CMD INSTALL --no-docs --no-multiarch .

      - name: Run benchmarks (baseline)
        run: Rscript benchmarks/run.R bench-baseline.json

      - name: Restore PR library code
        run: git checkout HEAD -- R src NAMESPACE

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ github.event.pull_request.number }}-${{ github.run_number }}
          path: |
            bench-current.json
            bench-baseline.json
          retention-days: 90

      - name: Compare (fail on >15% regression)
        shell: bash
        run: Rscript benchmarks/compare.R bench-baseline.json bench-current.json 15 | tee -a "$GITHUB_STEP_SUMMARY"
